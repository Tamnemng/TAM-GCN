work_dir: ./work_dir/ntu/resnet_only_CS

# Processor
processor: processor.recognition_rgb.REC_Processor

feeder: feeder.feeder_ntu_resnet.Feeder
train_feeder_args:
  rgb_path: G:/NTU_STROI/   # <-- SUA LAI PATH CHUA STROI IMAGES
  label_path: train
  split: CS
  random_flip: True

test_feeder_args:
  rgb_path: G:/NTU_STROI/   # <-- SUA LAI PATH CHUA STROI IMAGES
  label_path: val
  split: CS

model: models.resnet_only.Model
model_args:
  num_class: 60
  pretrained: True

# Training
device: [0]
batch_size: 64
test_batch_size: 64
num_worker: 4
base_lr: 0.01
step: [30, 50]
num_epoch: 60
eval_interval: 1
