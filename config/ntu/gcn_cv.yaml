work_dir: ./work_dir/ntu/gcn_cv

# feeder
feeder: feeder.feeder_ntu_gcn.Feeder
train_feeder_args:
  data_path: G:/NTU60_CV_CLEAN.npz           # <-- SUA LAI DUONG DAN NPZ
  split: train
  debug: false
  random_rot: true
  p_interval: [0.5, 1]
  window_size: 64

test_feeder_args:
  data_path: G:/NTU60_CV_CLEAN.npz           # <-- SUA LAI DUONG DAN NPZ
  split: test
  debug: false
  p_interval: [0.95]
  window_size: 64

# model
model: models.ctrgcn.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: spatial

# optim
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]
nesterov: true
warm_up_epoch: 5

# training
device: [0]
batch_size: 32                # GPU local — goc la 512
test_batch_size: 64
num_worker: 4                 # Windows — goc la 48
num_epoch: 65
eval_interval: 5
