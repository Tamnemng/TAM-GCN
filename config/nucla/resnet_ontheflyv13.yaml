work_dir: ./work_dir/nucla/resnet_ontheflyv13

# feeder
feeder: feeder.feeder_nucla_fused_ctr_resnet.Feeder
train_feeder_args:
  data_path: C:/Users/nguyn/Downloads/NW-UCLA-ALL/NW-UCLA-ALL
  label_path: train
  rgb_path: C:/Users/nguyn/Downloads/ucla_fivefs-20260302T172922Z-1-001/ucla_fivefs/
  random_choose: True
  random_shift: False
  random_move: False
  window_size: 52
  normalization: False
  random_flip: True
  temporal_rgb_frames: 5

test_feeder_args:
  data_path: C:/Users/nguyn/Downloads/NW-UCLA-ALL/NW-UCLA-ALL
  label_path: val
  rgb_path: C:/Users/nguyn/Downloads/ucla_fivefs-20260302T172922Z-1-001/ucla_fivefs/
  temporal_rgb_frames: 5

# model — V13: V12 with 4 bugs fixed
model: models.resnet_ctrgcn_ontheflyv13.Model
model_args:
  resnet_args:
    num_class: 10
    pretrained: True
    consistency_weight: 0.1
    sp_feat_channels: 4
    init_sigma_sharp: 3.0
    init_sigma_coarse: 8.0
    cross_attn_dim: 16
  gcn_weights: ./result/nucla/CTROGC-GCN.pt
  gcn_args:
    num_class: 10
    num_point: 20
    num_person: 1
    graph: graph.ucla.Graph
    graph_args:
      labeling_mode: "spatial"

# optim — same schedule as V12
weight_decay: 0.0001
base_lr: 0.005
lr_scheduler: cosine
warmup_epochs: 5
step: [30, 60]

# training
device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 80
eval_interval: 1
label_smoothing: 0.1
