work_dir: ./work_dir/nucla/resnet_onthefly_v2

# feeder
feeder: feeder.feeder_nucla_fused_ctr_resnet.Feeder
train_feeder_args:
  data_path: C:/Users/nguyn/Downloads/NW-UCLA-ALL/NW-UCLA-ALL
  label_path: train
  rgb_path: C:/ucla_stroi/
  random_choose: True
  random_shift: False
  random_move: False
  window_size: 52
  normalization: False
  random_flip: True
  temporal_rgb_frames: 5

test_feeder_args:
  data_path: C:/Users/nguyn/Downloads/NW-UCLA-ALL/NW-UCLA-ALL
  label_path: val
  rgb_path: C:/ucla_stroi/
  temporal_rgb_frames: 5

# model
model: models.resnet_ctrgcn_onthefly.Model
model_args:
  resnet_args:
    num_class: 10
    pretrained: True
  gcn_weights: ./result/nucla/CTROGC-GCN.pt
  gcn_args:
    num_class: 10
    num_point: 20
    num_person: 1
    graph: graph.ucla.Graph
    graph_args:
      labeling_mode: "spatial"

# optim — Cosine annealing with warmup
weight_decay: 0.0001
base_lr: 0.005
lr_scheduler: cosine
warmup_epochs: 5
step: [30, 60]

# training
device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 80
eval_interval: 1
label_smoothing: 0.1
